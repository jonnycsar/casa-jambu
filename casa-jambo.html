<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa Jambú</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --bg:#f7f5f0; --card:#ffffff; --ink:#1f2328; --muted:#5d646d; --line:#e3ded4;
  --accent:#6b4c9a; --accent-soft:#efe9f7;
  --ok:#1f7a4d; --ok-soft:#e5f4ec; --warn:#9a6a00; --warn-soft:#fbf1d9; --bad:#b3261e; --bad-soft:#fbe6e4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181c; --card:#1f2228; --ink:#e8e6e1; --muted:#a3a8b0; --line:#343841;
    --accent:#b89be0; --accent-soft:#2c2538;
    --ok:#6fcf9c; --ok-soft:#1d3328; --warn:#e5b95c; --warn-soft:#3a3120; --bad:#f08a80; --bad-soft:#3b2322;
  }
}
:root[data-theme="dark"]{
  --bg:#16181c; --card:#1f2228; --ink:#e8e6e1; --muted:#a3a8b0; --line:#343841;
  --accent:#b89be0; --accent-soft:#2c2538;
  --ok:#6fcf9c; --ok-soft:#1d3328; --warn:#e5b95c; --warn-soft:#3a3120; --bad:#f08a80; --bad-soft:#3b2322;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:28px 16px 64px}
header h1{margin:0 0 4px;font-size:28px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted)}
nav{margin:18px 0 8px;display:flex;flex-wrap:wrap;gap:6px}
nav a{font-size:13px;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:999px;text-decoration:none}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 20px 12px;margin:16px 0}
h2{margin:0 0 12px;font-size:19px}
h3{margin:18px 0 8px;font-size:15px}
p,li{margin:0 0 10px}
ul{padding-left:20px;margin:0 0 10px}
.muted{color:var(--muted)}
.table-wrap{overflow-x:auto;margin:0 0 12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;white-space:nowrap}
tr.hl td{background:var(--accent-soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:0 0 12px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:18px;font-weight:600;margin-top:2px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;margin-right:6px}
.ok{color:var(--ok);background:var(--ok-soft)}
.warn{color:var(--warn);background:var(--warn-soft)}
.bad{color:var(--bad);background:var(--bad-soft)}
.callout{border-left:4px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:6px;margin:0 0 12px}
.callout.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--ink)}
.callout.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.status li{list-style:none;margin-left:-20px}
ol.check li{margin-bottom:8px}
footer{margin-top:24px;font-size:13px;color:var(--muted)}
footer a{color:var(--accent)}
code{font-family:ui-monospace,Menlo,monospace;font-size:13px}

.langbar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.langbar .in{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;justify-content:flex-end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px/1 inherit;font-family:inherit;padding:7px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
[data-lang][hidden]{display:none}

.grid .stat table{font-size:13px}
.grid .stat td{padding:6px 4px}
.grid .stat td:first-child{color:var(--muted)}
.grid .stat{min-width:0}

.cover{margin:0;max-width:920px;margin-inline:auto;padding-inline:16px;padding-block:20px 0}
.cover img{display:block;width:100%;max-width:100%;height:auto;max-height:440px;object-fit:cover;object-position:center 40%;border-radius:14px;border:1px solid var(--line)}

.gate{min-height:100%;display:grid;place-items:center;padding-block:48px;padding-inline:16px}
.gate form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:grid;gap:14px}
.gate h1{margin:0;font-size:22px;letter-spacing:-.01em}
.gate p{margin:0;color:var(--muted);font-size:14px}
.gate label{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.gate input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.gate input:focus-visible,.gate button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gate button{font:inherit;font-weight:600;padding:10px 14px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
.gate button[disabled]{opacity:.6;cursor:progress}
.gate .err{color:var(--bad);font-size:14px;min-height:1.2em}
</style>
</head>
<body>
<main class="gate" id="gate">
  <form id="unlock" autocomplete="off">
    <h1>Casa Jambú</h1>
    <p>Geschützter Bereich. Bitte Passwort eingeben.<br>Área protegida. Digite a senha.</p>
    <div style="display:grid;gap:6px">
      <label for="pw">Passwort / Senha</label>
      <input id="pw" type="password" autocomplete="current-password" required autofocus>
    </div>
    <button id="go" type="submit">Öffnen / Abrir</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>
<div id="app" hidden></div>

  function b64(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
  function initPage(){
(function(){
  var btns=document.querySelectorAll('.seg button');
  function set(l){
    document.querySelectorAll('[data-lang]').forEach(function(el){el.hidden=el.getAttribute('data-lang')!==l;});
    btns.forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-set')===l?'true':'false');});
    document.documentElement.lang=l==='de'?'de':'pt-BR';
    document.title=l==='de'?'Casa Jambú – Zusammenfassung':'Casa Jambú – Resumo';
    
  }
  btns.forEach(function(b){b.addEventListener('click',function(){set(b.getAttribute('data-set'));window.scrollTo(0,0);});});
  
  set('de');
})();
}
  var form=document.getElementById('unlock'),pw=document.getElementById('pw'),err=document.getElementById('err'),go=document.getElementById('go');
  form.addEventListener('submit',async function(e){
    e.preventDefault();err.textContent='';go.disabled=true;
    try{
      var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.value),'PBKDF2',false,['deriveKey']);
      var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
      var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
      var app=document.getElementById('app');
      app.innerHTML=new TextDecoder().decode(buf);
      document.getElementById('gate').hidden=true;app.hidden=false;pw.value='';
      initPage();
    }catch(x){err.textContent='Falsches Passwort. / Senha incorreta.';go.disabled=false;pw.select();}
  });
})();
